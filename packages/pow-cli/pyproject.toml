[project]
name = "pow-cli"
version = "0.4.0"
description = "Command line interface for Isaac Powerpack"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.11.11",
    "click>=8.1.7",
    "distro>=1.9.0",
    "tomli>=2; python_version < '3.11'",
    "rich",
    "tomlkit>=0.14.0",
]
license = "Apache-2.0"
authors = [
    { name = "Titiwat Munintravong" },
    { name = "Isaac Powerpack Contributors" },
]

[project.scripts]
pow = "pow_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pow_cli"]

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-mock>=3.15.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Never recurse into the Isaac Sim symlink created by `pow init` / init tests.
norecursedirs = ["_isaacsim"]

[[tool.uv.index]]
url = "https://pypi.nvidia.com/"
